name: Publish to npm

# Publishing happens on push to main. The version bump is already applied by the
# Version workflow inside the merged PR, so by the time we get here package.json
# holds the release version. `changeset publish` only publishes versions that are
# not already on the registry, so ordinary pushes to main are safe no-ops.
on:
  push:
    branches: ['main']
  workflow_dispatch:

# Never run two releases at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the git tag created by `changeset publish`
  id-token: write # mint the OIDC token npm uses to attach build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      # Publishes any package version not yet on npm, with signed provenance.
      # No-op when the current version is already published.
      - name: Publish to npm
        run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # `changeset publish` creates a git tag for each newly published version;
      # push those tags (no-op when nothing was published). Tags aren't covered
      # by branch protection, so this needs no special permissions.
      - name: Push release tags
        run: git push --tags
