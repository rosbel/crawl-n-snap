name: Publish to npm

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Never run two releases at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit / git tag
  pull-requests: write # open the "Version Packages" PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      # When there are pending changesets, this opens (or updates) a
      # "Version Packages" PR that bumps the version and updates CHANGELOG.md.
      # When that PR is merged (version changed, no changesets left), it
      # publishes to npm via `pnpm run release` (changeset publish), which
      # skips any version already on the registry — so pushes to main never
      # try to republish an existing version (the old cause of the failures).
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
