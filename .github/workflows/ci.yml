name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies (root)
        run: pnpm install

      - name: Install dependencies (ui)
        run: pnpm -C ui install

      - name: Build UI
        run: pnpm -C ui build

      - name: Build CLI
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      # Optional: Add step to upload coverage reports

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies (root)
        run: pnpm install

      - name: Install dependencies (ui)
        run: pnpm -C ui install

      - name: Lint
        run: pnpm run lint
